[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faar"
version = "0.1.0"
description = "Failure-Aware Agentic Recovery for OCR-RAG document question answering"
readme = "README.md"
requires-python = ">=3.12"
# faiss-cpu stays in the base install: the deterministic offline retriever
# uses a FAISS index even with the local-hash embedding backend.
dependencies = [
  "anthropic==0.49.0",
  "faiss-cpu==1.9.0.post1",
  "kaleido==0.2.1",
  "langchain-core==0.3.49",
  "langgraph==0.3.18",
  "numpy==1.26.4",
  "openai==1.68.2",
  "pandas==2.2.3",
  "plotly==6.0.1",
  "pydantic==2.10.6",
  "python-dotenv==1.0.1",
  "ragas==0.2.15",
  "rank-bm25==0.2.2",
  "einops==0.8.1",
  "sentence-transformers==3.4.1",
  "symspellpy==6.9.0",
  "transformers==4.51.3",
  "typer==0.12.5",
  "wandb==0.17.9",
]

[project.optional-dependencies]
aaai = [
  "accelerate==1.5.2",
  "colpali-engine==0.3.10",
  "docling==1.20.0",
  "label-studio==1.17.0",
  "pillow==10.4.0",
  "pytest==8.3.5",
  "torch==2.6.0",
  "torchvision==0.21.0",
]
# Neural extras already pinned in the base install for AAAI. Kept so prototype
# docs that say `pip install 'faar[ml]'` remain valid.
ml = [
  "sentence-transformers==3.4.1",
  "transformers==4.51.3",
]

[project.scripts]
faar-demo = "faar.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
faar = ["model_revisions.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["OHR-Bench"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"/*.py" = ["E402"]
"cluster/*.py" = ["E402"]
"scripts/**/*.py" = ["E402"]
